<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>villaye</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #87CEEB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.18));
      animation: float 2.8s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>
  <img
    src="https://upload.wikimedia.org/wikipedia/en/thumb/3/3b/SpongeBob_SquarePants_character.svg/1200px-SpongeBob_SquarePants_character.svg.png"
    alt="Patrick Star"
    onerror="this.src='https://static.wikia.nocookie.net/spongebob/images/4/4c/Patrick_Star.svg/revision/latest?cb=20201231223425'; this.onerror=null;"
  >
</body>
</html>
