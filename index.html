<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft 派大星</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #87CEEB;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      font-size: 18px;
      letter-spacing: 1px;
    }
    #ui span {
      background: rgba(0,0,0,0.45);
      padding: 6px 14px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="ui"><span>Minecraft 派大星 · 拖动旋转</span></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(8, 6, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 2.5, 0);
    controls.minDistance = 6;
    controls.maxDistance = 25;

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(8, 15, 10);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    scene.add(dir);

    // Ground (Minecraft-like grass)
    const groundGeo = new THREE.BoxGeometry(40, 1, 40);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x5d9c3f });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // Dirt layer under grass
    const dirt = new THREE.Mesh(
      new THREE.BoxGeometry(40, 2, 40),
      new THREE.MeshLambertMaterial({ color: 0x8B5A2B })
    );
    dirt.position.y = -2;
    scene.add(dirt);

    // Helper to create a voxel (cube)
    function voxel(x, y, z, color, size = 1) {
      const geo = new THREE.BoxGeometry(size, size, size);
      const mat = new THREE.MeshLambertMaterial({ color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Minecraft-style Patrick Star (blocky)
    const patrick = new THREE.Group();

    // Colors
    const PINK = 0xFF8FAB;
    const DARK_PINK = 0xE86A8A;
    const GREEN = 0x7CFC00;
    const WHITE = 0xFFFFFF;
    const BLACK = 0x222222;
    const PURPLE = 0x9B59B6;

    // Body (big blocky torso)
    patrick.add(voxel(0, 2.5, 0, PINK, 2.2));
    patrick.add(voxel(0, 1.2, 0, PINK, 2.4)); // lower body

    // Head
    patrick.add(voxel(0, 4.2, 0, PINK, 2.0));

    // Eyes
    patrick.add(voxel(-0.45, 4.4, 0.85, WHITE, 0.45));
    patrick.add(voxel(0.45, 4.4, 0.85, WHITE, 0.45));
    patrick.add(voxel(-0.45, 4.4, 1.05, BLACK, 0.25));
    patrick.add(voxel(0.45, 4.4, 1.05, BLACK, 0.25));

    // Mouth
    patrick.add(voxel(0, 3.7, 0.95, BLACK, 0.35));

    // Arms
    patrick.add(voxel(-1.6, 2.8, 0, PINK, 0.9));
    patrick.add(voxel(1.6, 2.8, 0, PINK, 0.9));
    // hands
    patrick.add(voxel(-2.2, 2.5, 0.1, PINK, 0.7));
    patrick.add(voxel(2.2, 2.5, 0.1, PINK, 0.7));

    // Legs
    patrick.add(voxel(-0.6, 0.3, 0, PINK, 0.9));
    patrick.add(voxel(0.6, 0.3, 0, PINK, 0.9));

    // Pants (green shorts)
    patrick.add(voxel(0, 1.5, 0.1, GREEN, 2.0));
    // purple spots on pants
    patrick.add(voxel(-0.6, 1.5, 0.9, PURPLE, 0.4));
    patrick.add(voxel(0.5, 1.3, 0.9, PURPLE, 0.35));

    // Belly button
    patrick.add(voxel(0, 2.3, 1.1, DARK_PINK, 0.25));

    scene.add(patrick);

    // Simple idle animation
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.02;
      patrick.position.y = Math.sin(t) * 0.15;
      patrick.rotation.y = Math.sin(t * 0.4) * 0.15;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
