<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>villaye</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #7ec8e3 0%, #a8d8ea 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 五角星造型的派大星（基于手办照片） */
    .patrick {
      position: relative;
      width: 260px;
      height: 340px;
      animation: float 3.2s ease-in-out infinite;
      filter: drop-shadow(0 14px 22px rgba(0,0,0,0.18));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    /* 中心身体（五角星的核心） */
    .body {
      position: absolute;
      left: 50%;
      top: 90px;
      transform: translateX(-50%);
      width: 130px;
      height: 150px;
      background: #f9a8b8;
      border-radius: 50% 50% 45% 45%;
      z-index: 2;
    }

    /* 顶部尖角（头） */
    .point.top {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 52px;
      height: 110px;
      background: #f9a8b8;
      border-radius: 26px 26px 10px 10px;
      z-index: 3;
    }

    /* 左上角（左臂） */
    .point.upper-left {
      position: absolute;
      left: 8px;
      top: 70px;
      width: 48px;
      height: 110px;
      background: #f9a8b8;
      border-radius: 24px;
      transform: rotate(-42deg);
      transform-origin: 80% 15%;
      z-index: 1;
    }
    .point.upper-left::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 6px;
      width: 36px;
      height: 30px;
      background: #f9a8b8;
      border-radius: 50%;
    }

    /* 右上角（右臂） */
    .point.upper-right {
      position: absolute;
      right: 8px;
      top: 70px;
      width: 48px;
      height: 110px;
      background: #f9a8b8;
      border-radius: 24px;
      transform: rotate(42deg);
      transform-origin: 20% 15%;
      z-index: 1;
    }
    .point.upper-right::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 6px;
      width: 36px;
      height: 30px;
      background: #f9a8b8;
      border-radius: 50%;
    }

    /* 左下角（左腿） */
    .point.lower-left {
      position: absolute;
      left: 48px;
      bottom: 8px;
      width: 40px;
      height: 95px;
      background: #f9a8b8;
      border-radius: 20px 20px 18px 18px;
      transform: rotate(18deg);
      z-index: 1;
    }
    .point.lower-left::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 16px;
      background: #f9a8b8;
      border-radius: 50%;
    }

    /* 右下角（右腿） */
    .point.lower-right {
      position: absolute;
      right: 48px;
      bottom: 8px;
      width: 40px;
      height: 95px;
      background: #f9a8b8;
      border-radius: 20px 20px 18px 18px;
      transform: rotate(-18deg);
      z-index: 1;
    }
    .point.lower-right::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 16px;
      background: #f9a8b8;
      border-radius: 50%;
    }

    /* 眼睛 */
    .eyes {
      position: absolute;
      left: 50%;
      top: 115px;
      transform: translateX(-50%);
      width: 92px;
      height: 48px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
    }
    .eye {
      width: 40px;
      height: 44px;
      background: #fff;
      border-radius: 50%;
      position: relative;
      border: 2.5px solid #222;
    }
    .eye::after {
      content: '';
      position: absolute;
      width: 15px;
      height: 17px;
      background: #222;
      border-radius: 50%;
      top: 13px;
      left: 12px;
    }

    /* 眉毛 */
    .brow {
      position: absolute;
      width: 20px;
      height: 5px;
      background: #333;
      border-radius: 3px;
      z-index: 6;
    }
    .brow.left { left: 72px; top: 98px; transform: rotate(-8deg); }
    .brow.right { right: 72px; top: 98px; transform: rotate(8deg); }

    /* 嘴巴（张嘴笑） */
    .mouth {
      position: absolute;
      left: 50%;
      top: 170px;
      transform: translateX(-50%);
      width: 60px;
      height: 40px;
      background: #222;
      border-radius: 0 0 32px 32px;
      z-index: 5;
      overflow: hidden;
    }
    .mouth::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 17px;
      background: #f26a8d;
      border-radius: 50% 50% 0 0;
    }
    .mouth::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 9px;
      width: 42px;
      height: 8px;
      background: #fff;
      border-radius: 0 0 4px 4px;
    }

    /* 肚脐 */
    .belly {
      position: absolute;
      left: 50%;
      top: 220px;
      transform: translateX(-50%);
      width: 14px;
      height: 10px;
      background: #e88a9a;
      border-radius: 50%;
      z-index: 4;
    }

    /* 短裤 */
    .pants {
      position: absolute;
      left: 50%;
      top: 240px;
      transform: translateX(-50%);
      width: 120px;
      height: 52px;
      background: #b8e05a;
      border-radius: 8px 8px 18px 18px;
      z-index: 3;
    }
    .flower {
      position: absolute;
      left: 18px;
      top: 10px;
      width: 36px;
      height: 30px;
      background: #9b59b6;
      border-radius: 50% 50% 45% 45%;
      z-index: 4;
    }
    .flower::before {
      content: '';
      position: absolute;
      right: -16px;
      top: 4px;
      width: 20px;
      height: 20px;
      background: #9b59b6;
      border-radius: 50%;
    }

    /* 底座 */
    .stand {
      position: absolute;
      left: 50%;
      bottom: -16px;
      transform: translateX(-50%);
      width: 95px;
      height: 12px;
      background: rgba(255,255,255,0.35);
      border-radius: 6px;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="patrick" title="派大星">
    <div class="point top"></div>
    <div class="point upper-left"></div>
    <div class="point upper-right"></div>
    <div class="point lower-left"></div>
    <div class="point lower-right"></div>
    <div class="body"></div>
    <div class="brow left"></div>
    <div class="brow right"></div>
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="mouth"></div>
    <div class="belly"></div>
    <div class="pants">
      <div class="flower"></div>
    </div>
    <div class="stand"></div>
  </div>
</body>
</html>
