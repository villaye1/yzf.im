<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>villaye</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #87CEEB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img {
      max-width: 85vw;
      max-height: 88vh;
      object-fit: contain;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.2));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
  </style>
</head>
<body>
  <!-- Official style Patrick Star (arms open, smiling) -->
  <img
    src="https://www.pngitem.com/pimgs/m/146-1468479_patrick-star-png-transparent-png.png"
    alt="派大星"
    onerror="this.src='https://i.ibb.co/0jKqZ8L/patrick.png'; this.onerror=null;"
  >
</body>
</html>
