<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>派大星</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #87CEEB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      position: relative;
      width: 320px;
      height: 380px;
    }

    /* 派大星主体 */
    .patrick {
      position: absolute;
      left: 50%;
      top: 40px;
      transform: translateX(-50%);
      width: 200px;
      height: 260px;
      animation: bounce 1.8s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-18px); }
    }

    /* 身体（粉色五角星简化） */
    .body {
      position: absolute;
      width: 160px;
      height: 180px;
      background: #FF69B4;
      border-radius: 50% 50% 45% 45%;
      left: 20px;
      top: 50px;
      box-shadow: inset -12px -15px 0 rgba(0,0,0,0.08);
    }

    /* 头 */
    .head {
      position: absolute;
      width: 130px;
      height: 110px;
      background: #FF69B4;
      border-radius: 50%;
      left: 35px;
      top: 10px;
      z-index: 2;
      box-shadow: inset -8px -8px 0 rgba(0,0,0,0.07);
    }

    /* 眼睛 */
    .eye {
      position: absolute;
      width: 28px;
      height: 34px;
      background: white;
      border-radius: 50%;
      top: 38px;
      z-index: 3;
      border: 2px solid #333;
    }
    .eye.left { left: 32px; }
    .eye.right { right: 32px; }

    .pupil {
      position: absolute;
      width: 12px;
      height: 14px;
      background: #222;
      border-radius: 50%;
      top: 12px;
      left: 8px;
    }

    /* 眉毛 */
    .brow {
      position: absolute;
      width: 22px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      top: 28px;
      z-index: 4;
    }
    .brow.left { left: 34px; transform: rotate(-8deg); }
    .brow.right { right: 34px; transform: rotate(8deg); }

    /* 嘴巴 */
    .mouth {
      position: absolute;
      width: 36px;
      height: 18px;
      border: 3px solid #333;
      border-top: none;
      border-radius: 0 0 20px 20px;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }

    /* 手臂 */
    .arm {
      position: absolute;
      width: 40px;
      height: 22px;
      background: #FF69B4;
      border-radius: 20px;
      top: 130px;
      z-index: 1;
    }
    .arm.left {
      left: -5px;
      transform: rotate(-30deg);
      animation: waveL 1.8s ease-in-out infinite;
    }
    .arm.right {
      right: -5px;
      transform: rotate(30deg);
      animation: waveR 1.8s ease-in-out infinite;
    }

    @keyframes waveL {
      0%, 100% { transform: rotate(-30deg); }
      50% { transform: rotate(-55deg); }
    }
    @keyframes waveR {
      0%, 100% { transform: rotate(30deg); }
      50% { transform: rotate(55deg); }
    }

    /* 腿 */
    .leg {
      position: absolute;
      width: 32px;
      height: 50px;
      background: #FF69B4;
      border-radius: 16px;
      bottom: 0;
    }
    .leg.left { left: 45px; }
    .leg.right { right: 45px; }

    /* 短裤 */
    .pants {
      position: absolute;
      width: 100px;
      height: 40px;
      background: #7CFC00;
      border-radius: 8px 8px 20px 20px;
      left: 50px;
      top: 175px;
      z-index: 2;
    }

    .pants::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 8px;
      background: #FF69B4;
      border-radius: 4px;
      top: -4px;
      left: 40px;
    }

    /* 文字 */
    .caption {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
      letter-spacing: 2px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="patrick">
      <div class="head">
        <div class="brow left"></div>
        <div class="brow right"></div>
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="body"></div>
      <div class="pants"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>
    <div class="caption">派大星</div>
  </div>
</body>
</html>
