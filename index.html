<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>villaye</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: #e0e0ff;
      text-shadow: 0 0 8px rgba(100,150,255,0.6);
      pointer-events: none;
      font-size: 16px;
      letter-spacing: 1px;
    }
    #ui span {
      background: rgba(10,10,30,0.7);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(100,140,255,0.25);
    }
  </style>
</head>
<body>
  <div id="ui"><span>villaye · 仰望城市夜景</span></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05051a);
    scene.fog = new THREE.FogExp2(0x05051a, 0.012);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(6, 4, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.target.set(0, 6, -8);
    controls.minDistance = 5;
    controls.maxDistance = 40;
    controls.maxPolarAngle = Math.PI * 0.48;

    // Ambient + city glow
    scene.add(new THREE.AmbientLight(0x334466, 0.4));
    const moon = new THREE.DirectionalLight(0xaabbff, 0.35);
    moon.position.set(-10, 30, 10);
    scene.add(moon);

    // Stars
    const starGeo = new THREE.BufferGeometry();
    const starCount = 800;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 180;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18 }));
    scene.add(stars);

    // Ground / street
    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(80, 1, 80),
      new THREE.MeshLambertMaterial({ color: 0x1a1a22 })
    );
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // Helper
    function box(x, y, z, w, h, d, color) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color })
      );
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    // City buildings (voxel skyline)
    const buildings = new THREE.Group();
    const buildingColors = [0x1e1e2e, 0x252538, 0x1a1a28, 0x222233];
    const windowColors = [0xfff3a0, 0xa0d8ff, 0xff9f7a, 0xd0a0ff, 0xa0ffc0];

    function makeBuilding(bx, bz, floors, width) {
      const h = floors * 1.4;
      const baseColor = buildingColors[Math.floor(Math.random() * buildingColors.length)];
      const b = box(bx, h / 2, bz, width, h, width, baseColor);
      buildings.add(b);

      // Windows
      for (let f = 0; f < floors; f++) {
        for (let side = 0; side < 4; side++) {
          if (Math.random() > 0.35) {
            const wy = 0.7 + f * 1.4;
            let wx = bx, wz = bz;
            if (side === 0) wz = bz + width / 2 + 0.05;
            if (side === 1) wz = bz - width / 2 - 0.05;
            if (side === 2) wx = bx + width / 2 + 0.05;
            if (side === 3) wx = bx - width / 2 - 0.05;
            const win = box(wx, wy, wz, 0.35, 0.45, 0.08, windowColors[Math.floor(Math.random() * windowColors.length)]);
            buildings.add(win);
          }
        }
      }
    }

    // Generate skyline
    for (let i = -6; i <= 6; i++) {
      for (let j = -8; j <= -2; j++) {
        if (Math.random() > 0.25) {
          const floors = 4 + Math.floor(Math.random() * 14);
          const w = 1.6 + Math.random() * 1.8;
          makeBuilding(i * 3.2 + (Math.random() - 0.5), j * 3.5, floors, w);
        }
      }
    }
    // Extra tall buildings in the back
    makeBuilding(-4, -18, 22, 2.5);
    makeBuilding(2, -20, 28, 2.8);
    makeBuilding(7, -17, 18, 2.2);
    makeBuilding(-9, -19, 16, 2.4);

    scene.add(buildings);

    // Minecraft Patrick (foreground, looking up at the city)
    const patrick = new THREE.Group();
    const PINK = 0xFF8FAB;
    const DARK_PINK = 0xE86A8A;
    const GREEN = 0x7CFC00;
    const WHITE = 0xFFFFFF;
    const BLACK = 0x222222;
    const PURPLE = 0x9B59B6;

    function voxel(x, y, z, color, size = 1) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(size, size, size),
        new THREE.MeshLambertMaterial({ color })
      );
      m.position.set(x, y, z);
      m.castShadow = true;
      return m;
    }

    patrick.add(voxel(0, 2.5, 0, PINK, 2.2));
    patrick.add(voxel(0, 1.2, 0, PINK, 2.4));
    patrick.add(voxel(0, 4.2, 0, PINK, 2.0));
    patrick.add(voxel(-0.45, 4.4, 0.85, WHITE, 0.45));
    patrick.add(voxel(0.45, 4.4, 0.85, WHITE, 0.45));
    patrick.add(voxel(-0.45, 4.4, 1.05, BLACK, 0.25));
    patrick.add(voxel(0.45, 4.4, 1.05, BLACK, 0.25));
    patrick.add(voxel(0, 3.7, 0.95, BLACK, 0.35));
    patrick.add(voxel(-1.6, 2.8, 0, PINK, 0.9));
    patrick.add(voxel(1.6, 2.8, 0, PINK, 0.9));
    patrick.add(voxel(-2.2, 2.5, 0.1, PINK, 0.7));
    patrick.add(voxel(2.2, 2.5, 0.1, PINK, 0.7));
    patrick.add(voxel(-0.6, 0.3, 0, PINK, 0.9));
    patrick.add(voxel(0.6, 0.3, 0, PINK, 0.9));
    patrick.add(voxel(0, 1.5, 0.1, GREEN, 2.0));
    patrick.add(voxel(-0.6, 1.5, 0.9, PURPLE, 0.4));
    patrick.add(voxel(0.5, 1.3, 0.9, PURPLE, 0.35));
    patrick.add(voxel(0, 2.3, 1.1, DARK_PINK, 0.25));

    // Place Patrick in the foreground, slightly tilted as if looking up
    patrick.position.set(0, 0, 6);
    patrick.rotation.x = -0.12;
    scene.add(patrick);

    // Soft city lights (point lights)
    for (let i = 0; i < 8; i++) {
      const pl = new THREE.PointLight(0xffaa66, 0.6, 25);
      pl.position.set(
        (Math.random() - 0.5) * 30,
        4 + Math.random() * 12,
        -8 - Math.random() * 12
      );
      scene.add(pl);
    }

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.015;
      patrick.position.y = Math.sin(t) * 0.08;
      stars.rotation.y += 0.0003;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
