<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>villaye</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #87CEEB;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 2.8, 0);
    controls.minDistance = 6;
    controls.maxDistance = 20;
    controls.enablePan = false;

    // Soft lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 10, 8);
    dir.castShadow = true;
    scene.add(dir);

    // Simple ground plane
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(8, 48),
      new THREE.MeshLambertMaterial({ color: 0x7CB342 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // ===== Patrick Star =====
    const patrick = new THREE.Group();
    const pinkMat = new THREE.MeshLambertMaterial({ color: 0xFF8FAB });
    const darkPinkMat = new THREE.MeshLambertMaterial({ color: 0xE86A8A });
    const greenMat = new THREE.MeshLambertMaterial({ color: 0x7CFC00 });
    const whiteMat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
    const blackMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const purpleMat = new THREE.MeshLambertMaterial({ color: 0x9B59B6 });

    // Body
    const body = new THREE.Mesh(new THREE.SphereGeometry(1.55, 28, 28), pinkMat);
    body.scale.set(1.15, 1.35, 1.05);
    body.position.y = 2.35;
    body.castShadow = true;
    patrick.add(body);

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(1.25, 28, 28), pinkMat);
    head.position.y = 4.4;
    head.castShadow = true;
    patrick.add(head);

    // Eyes
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), whiteMat);
    eyeL.position.set(-0.4, 4.55, 1.0);
    patrick.add(eyeL);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), whiteMat);
    eyeR.position.set(0.4, 4.55, 1.0);
    patrick.add(eyeR);

    const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), blackMat);
    pupilL.position.set(-0.4, 4.55, 1.22);
    patrick.add(pupilL);
    const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), blackMat);
    pupilR.position.set(0.4, 4.55, 1.22);
    patrick.add(pupilR);

    // Eyebrows
    const browL = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.08, 0.08), blackMat);
    browL.position.set(-0.4, 5.0, 1.05);
    browL.rotation.z = 0.15;
    patrick.add(browL);
    const browR = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.08, 0.08), blackMat);
    browR.position.set(0.4, 5.0, 1.05);
    browR.rotation.z = -0.15;
    patrick.add(browR);

    // Smile
    const mouth = new THREE.Mesh(
      new THREE.TorusGeometry(0.28, 0.06, 8, 20, Math.PI),
      blackMat
    );
    mouth.position.set(0, 4.1, 1.05);
    mouth.rotation.x = Math.PI;
    patrick.add(mouth);

    // Left arm (waving)
    const armGeo = new THREE.CylinderGeometry(0.27, 0.32, 2.0, 12);
    const armL = new THREE.Mesh(armGeo, pinkMat);
    armL.position.set(-1.9, 3.2, 0.2);
    armL.rotation.z = Math.PI / 2.2;
    armL.rotation.y = 0.3;
    armL.castShadow = true;
    patrick.add(armL);

    // Right arm (down / natural)
    const armR = new THREE.Mesh(armGeo, pinkMat);
    armR.position.set(1.7, 2.6, 0);
    armR.rotation.z = -Math.PI / 3.5;
    armR.castShadow = true;
    patrick.add(armR);

    // Hands
    const handL = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 12), pinkMat);
    handL.position.set(-2.9, 3.5, 0.4);
    patrick.add(handL);
    const handR = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 12), pinkMat);
    handR.position.set(2.5, 2.0, 0);
    patrick.add(handR);

    // Legs
    const legGeo = new THREE.CylinderGeometry(0.34, 0.4, 1.35, 12);
    const legL = new THREE.Mesh(legGeo, pinkMat);
    legL.position.set(-0.55, 0.7, 0);
    legL.castShadow = true;
    patrick.add(legL);
    const legR = new THREE.Mesh(legGeo, pinkMat);
    legR.position.set(0.55, 0.7, 0);
    legR.castShadow = true;
    patrick.add(legR);

    // Feet
    const footL = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), pinkMat);
    footL.scale.set(1, 0.55, 1.3);
    footL.position.set(-0.55, 0.12, 0.15);
    patrick.add(footL);
    const footR = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), pinkMat);
    footR.scale.set(1, 0.55, 1.3);
    footR.position.set(0.55, 0.12, 0.15);
    patrick.add(footR);

    // Green pants
    const pants = new THREE.Mesh(new THREE.CylinderGeometry(1.45, 1.5, 1.05, 24), greenMat);
    pants.position.y = 1.65;
    pants.castShadow = true;
    patrick.add(pants);

    // Purple spots
    const spot1 = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 10), purpleMat);
    spot1.position.set(-0.7, 1.65, 1.3);
    patrick.add(spot1);
    const spot2 = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), purpleMat);
    spot2.position.set(0.6, 1.5, 1.35);
    patrick.add(spot2);

    // Belly button
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), darkPinkMat);
    belly.position.set(0, 2.45, 1.5);
    patrick.add(belly);

    scene.add(patrick);

    // Wave animation
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.04;

      // Waving left arm
      armL.rotation.z = Math.PI / 2.2 + Math.sin(t) * 0.45;
      armL.rotation.x = Math.sin(t * 0.8) * 0.15;
      handL.position.y = 3.5 + Math.sin(t) * 0.35;
      handL.position.x = -2.9 + Math.cos(t) * 0.15;

      // Gentle body bob
      patrick.position.y = Math.sin(t * 0.5) * 0.06;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
