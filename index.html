<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>villaye</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: #e0e0ff;
      text-shadow: 0 0 8px rgba(100,150,255,0.6);
      pointer-events: none;
      font-size: 16px;
      letter-spacing: 1px;
    }
    #ui span {
      background: rgba(10,10,30,0.7);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(100,140,255,0.25);
    }
  </style>
</head>
<body>
  <div id="ui"><span>villaye · 仰望城市夜景</span></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05051a);
    scene.fog = new THREE.FogExp2(0x05051a, 0.012);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(5, 5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.target.set(0, 5, -6);
    controls.minDistance = 5;
    controls.maxDistance = 40;
    controls.maxPolarAngle = Math.PI * 0.48;

    scene.add(new THREE.AmbientLight(0x334466, 0.45));
    const moon = new THREE.DirectionalLight(0xaabbff, 0.4);
    moon.position.set(-10, 30, 10);
    scene.add(moon);

    // Stars
    const starGeo = new THREE.BufferGeometry();
    const starCount = 900;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) positions[i] = (Math.random() - 0.5) * 180;
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18 }));
    scene.add(stars);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(80, 1, 80),
      new THREE.MeshLambertMaterial({ color: 0x1a1a22 })
    );
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    function box(x, y, z, w, h, d, color) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color })
      );
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    // City skyline
    const buildings = new THREE.Group();
    const buildingColors = [0x1e1e2e, 0x252538, 0x1a1a28, 0x222233];
    const windowColors = [0xfff3a0, 0xa0d8ff, 0xff9f7a, 0xd0a0ff, 0xa0ffc0];

    function makeBuilding(bx, bz, floors, width) {
      const h = floors * 1.4;
      const baseColor = buildingColors[Math.floor(Math.random() * buildingColors.length)];
      buildings.add(box(bx, h / 2, bz, width, h, width, baseColor));
      for (let f = 0; f < floors; f++) {
        for (let side = 0; side < 4; side++) {
          if (Math.random() > 0.35) {
            const wy = 0.7 + f * 1.4;
            let wx = bx, wz = bz;
            if (side === 0) wz = bz + width / 2 + 0.05;
            if (side === 1) wz = bz - width / 2 - 0.05;
            if (side === 2) wx = bx + width / 2 + 0.05;
            if (side === 3) wx = bx - width / 2 - 0.05;
            buildings.add(box(wx, wy, wz, 0.35, 0.45, 0.08, windowColors[Math.floor(Math.random() * windowColors.length)]));
          }
        }
      }
    }

    for (let i = -6; i <= 6; i++) {
      for (let j = -8; j <= -2; j++) {
        if (Math.random() > 0.25) {
          makeBuilding(i * 3.2 + (Math.random() - 0.5), j * 3.5, 4 + Math.floor(Math.random() * 14), 1.6 + Math.random() * 1.8);
        }
      }
    }
    makeBuilding(-4, -18, 22, 2.5);
    makeBuilding(2, -20, 28, 2.8);
    makeBuilding(7, -17, 18, 2.2);
    makeBuilding(-9, -19, 16, 2.4);
    scene.add(buildings);

    // ===== More realistic Patrick with arms open =====
    const patrick = new THREE.Group();
    const pinkMat = new THREE.MeshLambertMaterial({ color: 0xFF8FAB });
    const darkPinkMat = new THREE.MeshLambertMaterial({ color: 0xE86A8A });
    const greenMat = new THREE.MeshLambertMaterial({ color: 0x7CFC00 });
    const whiteMat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
    const blackMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const purpleMat = new THREE.MeshLambertMaterial({ color: 0x9B59B6 });

    // Body (rounded)
    const body = new THREE.Mesh(new THREE.SphereGeometry(1.6, 24, 24), pinkMat);
    body.scale.set(1.15, 1.35, 1.0);
    body.position.y = 2.4;
    body.castShadow = true;
    patrick.add(body);

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(1.25, 24, 24), pinkMat);
    head.position.y = 4.5;
    head.castShadow = true;
    patrick.add(head);

    // Eyes
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), whiteMat);
    eyeL.position.set(-0.4, 4.65, 1.0);
    patrick.add(eyeL);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), whiteMat);
    eyeR.position.set(0.4, 4.65, 1.0);
    patrick.add(eyeR);

    const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), blackMat);
    pupilL.position.set(-0.4, 4.65, 1.22);
    patrick.add(pupilL);
    const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), blackMat);
    pupilR.position.set(0.4, 4.65, 1.22);
    patrick.add(pupilR);

    // Eyebrows
    const browL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.08, 0.08), blackMat);
    browL.position.set(-0.4, 5.05, 1.05);
    browL.rotation.z = 0.2;
    patrick.add(browL);
    const browR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.08, 0.08), blackMat);
    browR.position.set(0.4, 5.05, 1.05);
    browR.rotation.z = -0.2;
    patrick.add(browR);

    // Mouth
    const mouth = new THREE.Mesh(
      new THREE.TorusGeometry(0.28, 0.06, 8, 16, Math.PI),
      blackMat
    );
    mouth.position.set(0, 4.15, 1.05);
    mouth.rotation.x = Math.PI;
    patrick.add(mouth);

    // Arms stretched out (双手张开)
    const armGeo = new THREE.CylinderGeometry(0.28, 0.32, 2.2, 12);
    const armL = new THREE.Mesh(armGeo, pinkMat);
    armL.position.set(-2.4, 3.0, 0);
    armL.rotation.z = Math.PI / 2;
    armL.castShadow = true;
    patrick.add(armL);

    const armR = new THREE.Mesh(armGeo, pinkMat);
    armR.position.set(2.4, 3.0, 0);
    armR.rotation.z = -Math.PI / 2;
    armR.castShadow = true;
    patrick.add(armR);

    // Hands
    const handL = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 12), pinkMat);
    handL.position.set(-3.5, 3.0, 0);
    patrick.add(handL);
    const handR = new THREE.Mesh(new THREE.SphereGeometry(0.38, 12, 12), pinkMat);
    handR.position.set(3.5, 3.0, 0);
    patrick.add(handR);

    // Legs
    const legGeo = new THREE.CylinderGeometry(0.35, 0.4, 1.4, 12);
    const legL = new THREE.Mesh(legGeo, pinkMat);
    legL.position.set(-0.55, 0.7, 0);
    legL.castShadow = true;
    patrick.add(legL);
    const legR = new THREE.Mesh(legGeo, pinkMat);
    legR.position.set(0.55, 0.7, 0);
    legR.castShadow = true;
    patrick.add(legR);

    // Feet
    const footL = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), pinkMat);
    footL.scale.set(1, 0.6, 1.3);
    footL.position.set(-0.55, 0.15, 0.15);
    patrick.add(footL);
    const footR = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), pinkMat);
    footR.scale.set(1, 0.6, 1.3);
    footR.position.set(0.55, 0.15, 0.15);
    patrick.add(footR);

    // Pants (green shorts)
    const pants = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.55, 1.1, 20), greenMat);
    pants.position.y = 1.7;
    pants.castShadow = true;
    patrick.add(pants);

    // Purple spots on pants
    const spot1 = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 10), purpleMat);
    spot1.position.set(-0.7, 1.7, 1.35);
    patrick.add(spot1);
    const spot2 = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), purpleMat);
    spot2.position.set(0.6, 1.55, 1.4);
    patrick.add(spot2);

    // Belly button
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), darkPinkMat);
    belly.position.set(0, 2.5, 1.55);
    patrick.add(belly);

    // Place Patrick looking up at the city
    patrick.position.set(0, 0, 5.5);
    patrick.rotation.x = -0.15;
    scene.add(patrick);

    // City lights
    for (let i = 0; i < 10; i++) {
      const pl = new THREE.PointLight(0xffaa66, 0.55, 28);
      pl.position.set((Math.random() - 0.5) * 30, 4 + Math.random() * 14, -8 - Math.random() * 14);
      scene.add(pl);
    }

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.015;
      patrick.position.y = Math.sin(t) * 0.06;
      // gentle arm sway
      armL.rotation.y = Math.sin(t * 0.7) * 0.08;
      armR.rotation.y = Math.sin(t * 0.7 + 1) * 0.08;
      stars.rotation.y += 0.00025;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
