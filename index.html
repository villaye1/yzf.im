<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>villaye</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #7ec8e3 0%, #a8d8ea 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Modular Patrick based on the uploaded Nendoroid photo */
    .patrick {
      position: relative;
      width: 220px;
      height: 320px;
      animation: float 3.2s ease-in-out infinite;
      filter: drop-shadow(0 14px 22px rgba(0,0,0,0.18));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    .body {
      position: absolute;
      left: 50%;
      top: 55px;
      transform: translateX(-50%);
      width: 140px;
      height: 170px;
      background: #f9a8b8;
      border-radius: 70px 70px 55px 55px;
      z-index: 2;
    }
    .head-tip {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 48px;
      height: 95px;
      background: #f9a8b8;
      border-radius: 24px 24px 8px 8px;
      z-index: 3;
    }
    .arm.left {
      position: absolute;
      left: -10px;
      top: 85px;
      width: 42px;
      height: 95px;
      background: #f9a8b8;
      border-radius: 22px;
      transform: rotate(-35deg);
      transform-origin: 70% 10%;
      z-index: 1;
    }
    .arm.left::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 4px;
      width: 34px;
      height: 28px;
      background: #f9a8b8;
      border-radius: 50%;
    }
    .arm.right {
      position: absolute;
      right: -10px;
      top: 85px;
      width: 42px;
      height: 95px;
      background: #f9a8b8;
      border-radius: 22px;
      transform: rotate(35deg);
      transform-origin: 30% 10%;
      z-index: 1;
    }
    .arm.right::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 4px;
      width: 34px;
      height: 28px;
      background: #f9a8b8;
      border-radius: 50%;
    }
    .eyes {
      position: absolute;
      left: 50%;
      top: 105px;
      transform: translateX(-50%);
      width: 90px;
      height: 48px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
    }
    .eye {
      width: 38px;
      height: 42px;
      background: #fff;
      border-radius: 50%;
      position: relative;
      border: 2px solid #222;
    }
    .eye::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 16px;
      background: #222;
      border-radius: 50%;
      top: 12px;
      left: 11px;
    }
    .brow {
      position: absolute;
      width: 18px;
      height: 5px;
      background: #333;
      border-radius: 3px;
      z-index: 6;
    }
    .brow.left { left: 62px; top: 88px; transform: rotate(-8deg); }
    .brow.right { right: 62px; top: 88px; transform: rotate(8deg); }
    .mouth {
      position: absolute;
      left: 50%;
      top: 158px;
      transform: translateX(-50%);
      width: 58px;
      height: 38px;
      background: #222;
      border-radius: 0 0 30px 30px;
      z-index: 5;
      overflow: hidden;
    }
    .mouth::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 16px;
      background: #f26a8d;
      border-radius: 50% 50% 0 0;
    }
    .mouth::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 8px;
      width: 42px;
      height: 8px;
      background: #fff;
      border-radius: 0 0 4px 4px;
    }
    .belly {
      position: absolute;
      left: 50%;
      top: 210px;
      transform: translateX(-50%);
      width: 14px;
      height: 10px;
      background: #e88a9a;
      border-radius: 50%;
      z-index: 4;
    }
    .pants {
      position: absolute;
      left: 50%;
      top: 230px;
      transform: translateX(-50%);
      width: 130px;
      height: 55px;
      background: #b8e05a;
      border-radius: 8px 8px 20px 20px;
      z-index: 3;
    }
    .flower {
      position: absolute;
      left: 22px;
      top: 12px;
      width: 38px;
      height: 32px;
      background: #9b59b6;
      border-radius: 50% 50% 45% 45%;
      z-index: 4;
    }
    .flower::before {
      content: '';
      position: absolute;
      right: -18px;
      top: 4px;
      width: 22px;
      height: 22px;
      background: #9b59b6;
      border-radius: 50%;
    }
    .leg {
      position: absolute;
      bottom: 0;
      width: 32px;
      height: 42px;
      background: #f9a8b8;
      border-radius: 0 0 16px 16px;
      z-index: 2;
    }
    .leg.left { left: 58px; }
    .leg.right { right: 58px; }
    .leg::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 14px;
      background: #f9a8b8;
      border-radius: 50%;
    }
    .stand {
      position: absolute;
      left: 50%;
      bottom: -18px;
      transform: translateX(-50%);
      width: 90px;
      height: 12px;
      background: rgba(255,255,255,0.35);
      border-radius: 6px;
      z-index: 0;
    }
  </style>
</head>
<body>
  <!-- Modular CSS recreation based on the uploaded Nendoroid Patrick Star figure -->
  <div class="patrick" title="派大星">
    <div class="head-tip"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="body"></div>
    <div class="brow left"></div>
    <div class="brow right"></div>
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="mouth"></div>
    <div class="belly"></div>
    <div class="pants">
      <div class="flower"></div>
    </div>
    <div class="leg left"></div>
    <div class="leg right"></div>
    <div class="stand"></div>
  </div>
</body>
</html>
