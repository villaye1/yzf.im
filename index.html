<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YZF.IM · 奶龙导航</title>
  <meta name="description" content="YZF 的个人导航页">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a1f;
      --card-hover: #24242b;
      --text: #f2f2f2;
      --muted: #8b8b95;
      --accent: #facc15;
      --border: #2a2a32;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* 奶龙动画区域 */
    .nailong-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      position: relative;
    }

    .nailong {
      width: 160px;
      height: 180px;
      position: relative;
      animation: bounce 2.2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* 身体 */
    .body {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 100px;
      background: #facc15;
      border-radius: 50% 50% 45% 45%;
      box-shadow: inset -8px -10px 0 rgba(0,0,0,0.08);
    }

    /* 肚子 */
    .belly {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 55px;
      background: #fef9c3;
      border-radius: 50%;
    }

    /* 头 */
    .head {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 95px;
      height: 85px;
      background: #facc15;
      border-radius: 50%;
      box-shadow: inset -6px -6px 0 rgba(0,0,0,0.07);
      z-index: 2;
    }

    /* 眼睛 */
    .eye {
      position: absolute;
      top: 32px;
      width: 22px;
      height: 26px;
      background: #166534;
      border-radius: 50%;
      z-index: 3;
    }
    .eye.left { left: 22px; }
    .eye.right { right: 22px; }

    .eye::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
    }

    /* 嘴巴 */
    .mouth {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 14px;
      border: 3px solid #166534;
      border-top: none;
      border-radius: 0 0 20px 20px;
      z-index: 3;
    }

    /* 手臂 */
    .arm {
      position: absolute;
      bottom: 55px;
      width: 28px;
      height: 18px;
      background: #facc15;
      border-radius: 20px;
      z-index: 1;
    }
    .arm.left {
      left: 8px;
      transform: rotate(-25deg);
      animation: wave-left 2.2s ease-in-out infinite;
    }
    .arm.right {
      right: 8px;
      transform: rotate(25deg);
      animation: wave-right 2.2s ease-in-out infinite;
    }

    @keyframes wave-left {
      0%, 100% { transform: rotate(-25deg); }
      50% { transform: rotate(-45deg); }
    }
    @keyframes wave-right {
      0%, 100% { transform: rotate(25deg); }
      50% { transform: rotate(45deg); }
    }

    /* 脚 */
    .foot {
      position: absolute;
      bottom: 8px;
      width: 28px;
      height: 16px;
      background: #eab308;
      border-radius: 40% 40% 50% 50%;
    }
    .foot.left { left: 38px; }
    .foot.right { right: 38px; }

    .name {
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-top: 0.8rem;
      margin-bottom: 0.25rem;
    }

    .bio {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.95rem 1.15rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .link:hover {
      background: var(--card-hover);
      border-color: #3a3a45;
      transform: translateY(-2px);
    }

    .link .icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .link .icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .footer {
      margin-top: 2.8rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
