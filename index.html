<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YZF.IM</title>
  <meta name="description" content="YZF 的个人导航页">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>Y</text></svg>">
  <style>
    :root {
      --bg: #0c0c0c;
      --card: #161616;
      --card-hover: #1f1f1f;
      --text: #f0f0f0;
      --muted: #8a8a8a;
      --accent: #3b82f6;
      --border: #262626;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .profile {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 600;
      color: white;
      margin: 0 auto 1.25rem;
      letter-spacing: -0.02em;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .bio {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.95rem 1.15rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .link:hover {
      background: var(--card-hover);
      border-color: #333;
      transform: translateY(-1px);
    }

    .link .icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .link .icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <div class="avatar">Y</div>
      <h1 class="name">YZF</h1>
