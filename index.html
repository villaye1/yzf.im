<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>villaye</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #7ec8e3 0%, #a8d8ea 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .patrick {
      position: relative;
      width: 280px;
      height: 360px;
      animation: float 3.2s ease-in-out infinite;
      filter: drop-shadow(0 16px 24px rgba(0,0,0,0.2));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    /* 中心核心 - 加大并确保完全填满中间 */
    .core {
      position: absolute;
      left: 50%;
      top: 85px;
      transform: translateX(-50%);
      width: 145px;
      height: 155px;
      background: #f9a8b8;
      border-radius: 50%;
      z-index: 2;
    }

    /* 五个尖角 - 根部加粗，深入中心，消除空隙 */
    .arm {
      position: absolute;
      background: #f9a8b8;
      z-index: 1;
    }

    /* 顶部尖角（头） */
    .arm.top {
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 52px;
      height: 130px;
      border-radius: 26px 26px 10px 10px;
      z-index: 3;
    }

    /* 左上尖角 - 根部更宽，更深入中心 */
    .arm.upper-left {
      left: -5px;
      top: 50px;
      width: 70px;
      height: 130px;
      border-radius: 35px;
      transform: rotate(-45deg);
      transform-origin: 90% 15%;
    }
    .arm.upper-left::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 12px;
      width: 40px;
      height: 34px;
      background: #f9a8b8;
      border-radius: 50%;
    }

    /* 右上尖角 */
    .arm.upper-right {
      right: -5px;
      top: 50px;
      width: 70px;
      height: 130px;
      border-radius: 35px;
      transform: rotate(45deg);
      transform-origin: 10% 15%;
    }
    .arm.upper-right::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 12px;
      width: 40px;
      height: 34px;
      background: #f9a8b8;
      border-radius: 50%;
    }

    /* 左下尖角 */
    .arm.lower-left {
      left: 30px;
      bottom: 0;
      width: 58px;
      height: 120px;
      border-radius: 28px 28px 22px 22px;
      transform: rotate(20deg);
    }
    .arm.lower-left::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 18px;
      background: #f9a8b8;
      border-radius: 50%;
    }

    /* 右下尖角 */
    .arm.lower-right {
      right: 30px;
      bottom: 0;
      width: 58px;
      height: 120px;
      border-radius: 28px 28px 22px 22px;
      transform: rotate(-20deg);
    }
    .arm.lower-right::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 18px;
      background: #f9a8b8;
      border-radius: 50%;
    }

    /* 脸部 */
    .face {
      position: absolute;
      left: 50%;
      top: 95px;
      transform: translateX(-50%);
      width: 100px;
      height: 110px;
      z-index: 5;
    }

    .brow {
      position: absolute;
      width: 20px;
      height: 5px;
      background: #333;
      border-radius: 3px;
    }
    .brow.left { left: 18px; top: 8px; transform: rotate(-10deg); }
    .brow.right { right: 18px; top: 8px; transform: rotate(10deg); }

    .eyes {
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      width: 88px;
      display: flex;
      justify-content: space-between;
    }
    .eye {
      width: 38px;
      height: 42px;
      background: #fff;
      border: 2.5px solid #222;
      border-radius: 50%;
      position: relative;
    }
    .eye::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 16px;
      background: #222;
      border-radius: 50%;
      top: 12px;
      left: 11px;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      width: 56px;
      height: 36px;
      background: #222;
      border-radius: 0 0 30px 30px;
      overflow: hidden;
    }
    .mouth::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 15px;
      background: #f26a8d;
      border-radius: 50% 50% 0 0;
    }
    .mouth::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 8px;
      width: 40px;
      height: 7px;
      background: #fff;
      border-radius: 0 0 4px 4px;
    }

    .belly {
      position: absolute;
      left: 50%;
      top: 225px;
      transform: translateX(-50%);
      width: 13px;
      height: 10px;
      background: #e88a9a;
      border-radius: 50%;
      z-index: 4;
    }

    .pants {
      position: absolute;
      left: 50%;
      top: 245px;
      transform: translateX(-50%);
      width: 120px;
      height: 52px;
      background: #b8e05a;
      border-radius: 6px 6px 16px 16px;
      z-index: 3;
    }
    .flower {
      position: absolute;
      left: 18px;
      top: 10px;
      width: 34px;
      height: 28px;
      background: #9b59b6;
      border-radius: 50% 50% 40% 40%;
    }
    .flower::before {
      content: '';
      position: absolute;
      right: -14px;
      top: 3px;
      width: 18px;
      height: 18px;
      background: #9b59b6;
      border-radius: 50%;
    }

    .stand {
      position: absolute;
      left: 50%;
      bottom: -14px;
      transform: translateX(-50%);
      width: 100px;
      height: 12px;
      background: rgba(255,255,255,0.35);
      border-radius: 6px;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="patrick" title="派大星">
    <div class="arm top"></div>
    <div class="arm upper-left"></div>
    <div class="arm upper-right"></div>
    <div class="arm lower-left"></div>
    <div class="arm lower-right"></div>
    <div class="core"></div>
    <div class="face">
      <div class="brow left"></div>
      <div class="brow right"></div>
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth"></div>
    </div>
    <div class="belly"></div>
    <div class="pants">
      <div class="flower"></div>
    </div>
    <div class="stand"></div>
  </div>
</body>
</html>
